<html lang="en">

  <title>SmarTech — Smart Technology for Everyone</title>
  <meta name="description" content="SmarTech — discover smart technology, AI, gadgets, trends and useful digital ideas.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* NAVIGATION */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 17, 31, 0.95);
      border-bottom: 1px solid #1c3048;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #00d9ff;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #d7e4f3;
      font-size: 15px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #00d9ff;
    }
